<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potato AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background-color: #f4f4f5;
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #18181b;
      color: #ffffff;
      padding: 14px 24px;
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .header-title { display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 9px; height: 9px; background: #22c55e; border-radius: 50%; }
    .clear-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #e4e4e7;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .clear-btn:hover { background: rgba(255,255,255,0.22); }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .messages-wrapper {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.96rem;
      line-height: 1.55;
      word-wrap: break-word;
    }
    .bot-message {
      background: #ffffff;
      color: #18181b;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .user-message {
      background: #2563eb;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .error-message {
      background: #fee2e2;
      color: #991b1b;
      align-self: flex-start;
      font-size: 0.88rem;
    }
    .message img {
      max-width: 280px;
      width: 100%;
      border-radius: 8px;
      margin-bottom: 8px;
      display: block;
    }

    .bot-message h1, .bot-message h2, .bot-message h3 { margin: 12px 0 6px 0; font-size: 1.08rem; color: #09090b; font-weight: 700; }
    .bot-message h1:first-child, .bot-message h2:first-child, .bot-message h3:first-child { margin-top: 0; }
    .bot-message p { margin-bottom: 8px; }
    .bot-message p:last-child { margin-bottom: 0; }
    .bot-message ul, .bot-message ol { margin: 6px 0 10px 22px; }
    .bot-message li { margin-bottom: 4px; }
    .bot-message code { background: #f4f4f5; padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 0.9em; color: #be123c; }
    .bot-message pre { background: #18181b; color: #f4f4f5; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
    .bot-message pre code { background: transparent; color: inherit; padding: 0; }

    .bottom-area {
      background: #ffffff;
      border-top: 1px solid #e4e4e7;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .bottom-wrapper {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .image-preview-bar {
      display: none;
      padding: 8px 12px;
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #3f3f46;
    }
    .image-preview-bar.active { display: flex; }
    .preview-info { display: flex; align-items: center; gap: 10px; }
    .preview-thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; border: 1px solid #d4d4d8; }
    .remove-img-btn { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.78rem; }

    .chat-input { display: flex; gap: 8px; align-items: center; width: 100%; }
    .attach-btn {
      background: #f4f4f5;
      border: 1px solid #d4d4d8;
      color: #3f3f46;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .attach-btn:hover { background: #e4e4e7; }
    .chat-input input[type="text"] {
      flex: 1;
      padding: 11px 16px;
      border: 1px solid #d4d4d8;
      border-radius: 22px;
      outline: none;
      font-size: 0.96rem;
    }
    .chat-input input[type="text"]:focus { border-color: #2563eb; }
    .send-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 11px 20px;
      border-radius: 22px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .send-btn:hover { background: #1d4ed8; }
    .send-btn:disabled { background: #a1a1aa; cursor: not-allowed; }

    @media (max-width: 600px) {
      .message { max-width: 92%; }
      .chat-header { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<div class="chat-header">
  <div class="header-title">
    <div class="status-dot"></div>
    <span>Potato AI</span>
  </div>
  <button type="button" class="clear-btn" id="clearChatBtn">Nova conversa</button>
</div>

<div class="chat-messages" id="chatMessages">
  <div class="messages-wrapper" id="messagesWrapper">
    <div class="message bot-message">Olá! Como posso ajudar você hoje? Você também pode enviar imagens clicando no clipe ou colando um print (Ctrl+V).</div>
  </div>
</div>

<div class="bottom-area">
  <div class="bottom-wrapper">
    <div class="image-preview-bar" id="imagePreviewBar">
      <div class="preview-info">
        <img id="previewThumb" class="preview-thumb" src="" alt="Preview">
        <span id="imageName">Imagem selecionada</span>
      </div>
      <button type="button" class="remove-img-btn" id="removeImgBtn">Remover</button>
    </div>

    <div class="chat-input">
      <input type="file" id="imageInput" accept="image/*" style="display:none;">
      <label for="imageInput" class="attach-btn" title="Enviar imagem">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
        </svg>
      </label>
      <input type="text" id="userInput" placeholder="Digite sua mensagem..." autocomplete="off">
      <button type="button" class="send-btn" id="sendBtn">Enviar</button>
    </div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzvfDOjrfPN3HFKrCJn9yO3aWr3EtPaI4rmtAtcARbPVZjyNlJwuN-k43dGJP5nKcr9Ow/exec';

  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatMessages = document.getElementById('chatMessages');
  const messagesWrapper = document.getElementById('messagesWrapper');
  const clearChatBtn = document.getElementById('clearChatBtn');
  const imageInput = document.getElementById('imageInput');
  const imagePreviewBar = document.getElementById('imagePreviewBar');
  const previewThumb = document.getElementById('previewThumb');
  const imageName = document.getElementById('imageName');
  const removeImgBtn = document.getElementById('removeImgBtn');

  let chatHistory = [];
  let selectedImageBase64 = null;
  let selectedImageMimeType = null;

  function loadImageFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = function() {
      const dataUrl = reader.result;
      selectedImageMimeType = file.type;
      selectedImageBase64 = dataUrl.split(',')[1];
      previewThumb.src = dataUrl;
      imageName.textContent = file.name || 'Imagem colada';
      imagePreviewBar.classList.add('active');
    };
    reader.readAsDataURL(file);
  }

  imageInput.addEventListener('change', function(e) {
    if (e.target.files && e.target.files.length > 0) {
      loadImageFile(e.target.files[0]);
    }
  });

  userInput.addEventListener('paste', function(e) {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        const blob = items[i].getAsFile();
        loadImageFile(blob);
        break;
      }
    }
  });

  removeImgBtn.addEventListener('click', clearImageSelection);

  function clearImageSelection() {
    selectedImageBase64 = null;
    selectedImageMimeType = null;
    imageInput.value = '';
    previewThumb.src = '';
    imagePreviewBar.classList.remove('active');
  }

  clearChatBtn.addEventListener('click', function() {
    chatHistory = [];
    messagesWrapper.innerHTML = '<div class="message bot-message">Conversa reiniciada. Como posso ajudar?</div>';
  });

  function formatBotText(text) {
    let html = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    html = html.replace(/```([a-zA-Z]*)
([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
    html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
    html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
    html = html.replace(/^\s*[\*\-] (.*$)/gim, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
    html = html.replace(/
/g, '<br>');
    html = html.replace(/<\/(h1|h2|h3|pre|ul)><br>/g, '</$1>');
    html = html.replace(/<\/li><br>/g, '</li>');

    return html;
  }

  function addMessage(text, type, imageUrl = null) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message');
    if (type === 'user') msgDiv.classList.add('user-message');
    else if (type === 'error') msgDiv.classList.add('error-message');
    else msgDiv.classList.add('bot-message');

    if (imageUrl) {
      const img = document.createElement('img');
      img.src = imageUrl;
      msgDiv.appendChild(img);
    }

    if (text) {
      const textNode = document.createElement('div');
      if (type === 'bot') {
        textNode.innerHTML = formatBotText(text);
      } else {
        textNode.textContent = text;
      }
      msgDiv.appendChild(textNode);
    }

    messagesWrapper.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return msgDiv;
  }

  async function askGemini(prompt, imgBase64, imgMimeType) {
    const parts = [];
    if (prompt) parts.push({ text: prompt });
    if (imgBase64 && imgMimeType) {
      parts.push({
        inlineData: {
          mimeType: imgMimeType,
          data: imgBase64
        }
      });
    }

    chatHistory.push({ role: 'user', parts: parts });

    const response = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ contents: chatHistory })
    });

    const data = await response.json();

    if (data.error) {
      chatHistory.pop();
      throw new Error(data.error.message || 'Erro na resposta da API.');
    }

    const candidate = data.candidates && data.candidates[0];
    if (!candidate || !candidate.content || !candidate.content.parts) {
      chatHistory.pop();
      throw new Error('Resposta inesperada da API: ' + JSON.stringify(data));
    }

    const replyText = candidate.content.parts[0].text;
    chatHistory.push({ role: 'model', parts: [{ text: replyText }] });
    return replyText;
  }

  async function handleSend() {
    const message = userInput.value.trim();
    if (!message && !selectedImageBase64) return;

    const previewUrl = selectedImageBase64 ? `data:${selectedImageMimeType};base64,${selectedImageBase64}` : null;
    addMessage(message, 'user', previewUrl);

    const currentImgBase64 = selectedImageBase64;
    const currentImgMime = selectedImageMimeType;

    userInput.value = '';
    clearImageSelection();
    userInput.disabled = true;
    sendBtn.disabled = true;

    const loadingMsg = addMessage('Digitando...', 'bot');

    try {
      const reply = await askGemini(message, currentImgBase64, currentImgMime);
      loadingMsg.innerHTML = formatBotText(reply);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    } catch (err) {
      loadingMsg.remove();
      addMessage('Erro: ' + err.message, 'error');
    } finally {
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener('click', handleSend);

  userInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleSend();
    }
  });
</script>

</body>
</html>
